<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Vessel logo">
  <!-- Vessel: a holographic hull holding layered assets from many chains.
       The hull is open at the top because assets flow in and out via Intents. -->
  <defs>
    <linearGradient id="vs-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#050D1A"/>
    </linearGradient>
    <linearGradient id="vs-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="vs-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F4FA"/>
      <stop offset="1" stop-color="#9FB8C9"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vs-card)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#vs-teal)" stroke-width="2" opacity="0.7"/>
  <!-- hull: open chalice formed from a thick arc -->
  <path d="M34 38 L34 66 A30 30 0 0 0 94 66 L94 38"
        fill="none" stroke="url(#vs-teal)" stroke-width="8" stroke-linecap="round"/>
  <!-- keel -->
  <path d="M52 92 L76 92" stroke="url(#vs-silver)" stroke-width="7" stroke-linecap="round"/>
  <!-- stacked asset bands inside the hull: BTC, ETH, fiat layers -->
  <rect x="44" y="42" width="40" height="6.5" rx="3.25" fill="url(#vs-silver)"/>
  <rect x="44" y="54" width="40" height="6.5" rx="3.25" fill="#00C8FF" opacity="0.85"/>
  <rect x="44" y="66" width="40" height="6.5" rx="3.25" fill="url(#vs-silver)" opacity="0.75"/>
  <!-- orbiting chain node: the cross-chain link -->
  <circle cx="98" cy="34" r="7" fill="#050D1A" stroke="#00C8FF" stroke-width="3"/>
  <circle cx="98" cy="34" r="2.4" fill="#00C8FF"/>
</svg>
