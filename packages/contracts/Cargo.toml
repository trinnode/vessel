[workspace]
resolver = "2"
members = ["nft", "wallet", "marketplace", "mock-verifier"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing", "legacy"] }
near-contract-standards = "=5.29.1"
serde = "1"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
